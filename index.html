<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Character Study</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <div class="header-row">
            <div>
                <h1>Chinese Character Study</h1>
                <p class="header-sub" id="header-sub">Frequency-ranked characters with readings and examples</p>
            </div>
            <div class="toggle-group">
                <button id="toggle-dark" class="toggle-btn" title="Toggle dark mode">🌙</button>
                <button id="toggle-eng" class="toggle-btn" data-active="false" title="Show English definitions">ENG</button>
                <button id="toggle-study" class="toggle-btn" data-active="false" title="Study mode: hide pinyin &amp; examples">🎓</button>
            </div>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <input type="text" id="search-input" class="search-input"
                   placeholder="Search by character, pinyin, or English…"
                   autocomplete="off">
            <span class="search-info" id="search-info"></span>
        </div>

        <!-- Large character display grid -->
        <div class="char-grid-section">
            <div class="char-grid-label">Characters on this page</div>
            <div id="cbare" class="char-grid"></div>
            <div class="grid-actions">
                <button id="btn-speak-grid" class="grid-action-btn" title="Read all characters aloud" onclick="speakGrid()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                </button>
                <button id="btn-pause-grid" class="grid-action-btn" title="Pause" onclick="toggleGridPause()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                </button>
                <button id="btn-stop-grid" class="grid-action-btn" title="Stop playback" onclick="stopGrid()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Controls: page info -->
        <div class="controls">
            <span class="page-info" id="infospan"></span>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <button onclick="jumpToPage(1)">First</button>
            <button class="prev" onclick="changePage(-1)">← Prev</button>
            <button class="next" onclick="changePage(1)">Next →</button>
            <button onclick="jumpToPage(-1)">Last</button>

            <span class="pagination-spacer"></span>

            <span class="jump-group">
                <label for="jump-page">Jump to</label>
                <input type="number" id="jump-page" min="1" placeholder="Page">
                <button onclick="jumpToPage()">Go</button>
            </span>
        </div>

        <!-- Detail table -->
        <div class="detail-section">
            <table id="characters-table">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

        <hr>

        <!-- Local file loader -->
        <div class="file-section">
            <span class="file-label">Data source</span>
            <div class="file-row">
                <input type="file" id="local-data" accept=".json" class="file-input">
                <span class="file-status" id="datasource">Loading…</span>
                <button id="btn-download" class="download-btn" onclick="downloadData()" style="display:none" title="Download current data as JSON">⬇ Download</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
